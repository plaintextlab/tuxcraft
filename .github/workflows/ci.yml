# Lint on every push; build the ISO and install every distro from it in a VM.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: upstream distros change even when tuxcraft does not
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version
          mapfile -t files < <(grep -rlE '^#!.*(ba)?sh|^# shellcheck shell=' --exclude-dir=.git --exclude-dir=dotfiles . ; ls dotfiles/.config/polybar/*.sh dotfiles/.config/polybar/scripts/*.sh)
          # Warnings and errors fail the build; style notes are shown but do not.
          shellcheck -x --severity=warning "${files[@]}"
          shellcheck -x -f gcc "${files[@]}" || true
      - name: bash syntax
        run: |
          for f in install.sh lib/*.sh bin/* tests/*.sh scripts/*.sh iso/build.sh iso/airootfs/usr/local/bin/*; do
            head -n1 "$f" | grep -q python && continue
            bash -n "$f"
          done
      - name: POSIX bootstrap header (runs under dash on Debian/Void)
        run: |
          awk '/from here on: bash/{exit} {print}' install.sh > /tmp/top.sh && dash -n /tmp/top.sh
      - name: every download pinned with a checksum
        run: scripts/update-pins.sh --check

  iso:
    needs: lint
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'vm-test')
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: tools
        run: pacman -Syu --noconfirm --needed archiso git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          iso/build.sh "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: tuxcraft-iso
          path: out/tuxcraft-*.iso
          retention-days: 7

  vm:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: arch,   session: i3,   flags: "" }
          - { distro: arch,   session: sway, flags: "--luks" }
          - { distro: debian, session: i3,   flags: "" }
          - { distro: debian, session: sway, flags: "--luks" }
          - { distro: void,   session: i3,   flags: "" }
          - { distro: void,   session: sway, flags: "--luks" }
          - { distro: arch,   session: i3,   flags: "--bios" }
          - { distro: debian, session: i3,   flags: "--target free" }
    name: vm (${{ matrix.distro }}, ${{ matrix.session }} ${{ matrix.flags }})
    steps:
      - uses: actions/checkout@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: host tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf mtools dosfstools
      - uses: actions/download-artifact@v4
        with:
          name: tuxcraft-iso
          path: iso-in
      - name: install + check
        run: tests/ci-vm.sh "$(ls iso-in/tuxcraft-*.iso | head -n1)" ${{ matrix.distro }} --session ${{ matrix.session }} ${{ matrix.flags }}
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.distro }}-${{ matrix.session }}-${{ strategy.job-index }}
          path: |
            /tmp/tuxcraft-ci.*/install.log
            /tmp/tuxcraft-ci.*/serial-*.log
            /tmp/tuxcraft-ci.*/serve/up/
          if-no-files-found: ignore
