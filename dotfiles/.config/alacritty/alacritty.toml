# tuxcraft alacritty (from debi3n). Colours + font: theme.toml (generated by tux-theme).
[general]
import = ["~/.config/alacritty/theme.toml"]
live_config_reload = true

[window]
padding = { x = 10, y = 8 }
dynamic_padding = true
decorations = "None"

[scrolling]
history = 20000

[cursor]
blink_interval = 600
blink_timeout = 0
unfocused_hollow = true

[cursor.style]
shape = "Underline"
blinking = "On"

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
]
