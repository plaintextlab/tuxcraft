# tuxcraft kitty: the default terminal because it shows real images (kitty graphics protocol):
# album art in rmpc, previews in yazi, `img picture.jpg`, fastfetch logos.
# Colours + font: theme.conf (generated by tux-theme). Prefer Alacritty? TERMINAL=alacritty
# in ~/.config/tuxcraft/state.
include theme.conf

window_padding_width 8 10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 20000

cursor_shape underline
cursor_blink_interval 0.6
cursor_stop_blinking_after 0

copy_on_select clipboard
strip_trailing_spaces smart
url_style curly
detect_urls yes

# One window per terminal: tiling is i3/sway's job.
enabled_layouts stack
map ctrl+shift+enter new_os_window_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+t no_op
update_check_interval 0
