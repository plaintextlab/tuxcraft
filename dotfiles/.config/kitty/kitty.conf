# tuxcraft kitty: the default terminal because it shows real images (kitty graphics protocol):
# album art in rmpc, previews in yazi, `img picture.jpg`, fastfetch logos.
# Colours + font: theme.conf (generated by tux-theme). Prefer Alacritty? TERMINAL=alacritty
# in ~/.config/tuxcraft/state.
include theme.conf

window_padding_width 8 10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 20000

# Speed: as little latency as Alacritty (tux-term also reuses one kitty process for all windows).
input_delay 0
repaint_delay 4
sync_to_monitor no

# Cursor: a short trail when it jumps (like Neovide), smooth fading blink.
cursor_shape underline
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 15
cursor_trail 3
cursor_trail_decay 0.1 0.35
cursor_trail_start_threshold 2

copy_on_select clipboard
strip_trailing_spaces smart
url_style curly
detect_urls yes

# One window per terminal: tiling is i3/sway's job.
enabled_layouts stack
map ctrl+shift+enter new_os_window_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+t no_op
# Hand these to the program (Neovim's VS Code keys) instead of kitty's tab/window actions.
map ctrl+shift+f no_op
map ctrl+tab no_op
map ctrl+shift+tab no_op
update_check_interval 0
