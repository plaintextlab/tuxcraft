# mpd for rmpc (adapted from debi3n). The music folder is NOT set here: it lives in
# music.conf (next to this file), written by `tux-music folder <path>` or System menu → Music folder.
include_optional    "music.conf"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"
pid_file            "~/.config/mpd/pid"
auto_update         "yes"
restore_paused      "yes"
bind_to_address     "127.0.0.1"
audio_output {
    type "pipewire"
    name "PipeWire"
}
