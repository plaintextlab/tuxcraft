force-window=yes
keep-open=no
# Start centred; videos never larger than 1280x720 (smaller ones keep their size).
geometry=50%:50%
autofit-larger=1280x720

hwdec=auto-safe
vo=gpu-next
save-position-on-quit=yes

# Controls and on-screen text keep one size however big the window is. They only shrink
# when the window is narrower than the controls (bottom bar: 854 px, box: 580 px).
osd-scale-by-window=no
script-opts-append=osc-vidscale=no

# Music: a small square window for the cover art (not the art's full resolution), with the
# compact box controls, which fit it at full size.
[music]
profile-desc=Audio files (small window)
autofit=600x600
script-opts-append=osc-layout=box
save-position-on-quit=no
[extension.mp3]
profile=music
[extension.flac]
profile=music
[extension.m4a]
profile=music
[extension.ogg]
profile=music
[extension.opus]
profile=music
[extension.wav]
profile=music
[extension.aac]
profile=music
[extension.alac]
profile=music
[extension.wma]
profile=music
