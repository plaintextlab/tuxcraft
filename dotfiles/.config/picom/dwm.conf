# tuxcraft picom for the dwm session (tux-dwm): BreadOnPenguins' look, from her
# github.com/BreadOnPenguins/dots (.config/picom/picom.conf): round corners, blur behind every
# window, unfocused windows see-through, slow soft fades, barely any shadow.
# The i3 session keeps ~/.config/picom/picom.conf; tux-autostart starts picom with this file in
# dwm only. Your previous picom.conf is also kept in ~/.config/picom/backup/.
# Toggle picom at runtime: Super+Escape -> "Compositor on/off".

backend = "glx";   # hers is "egl"; glx is what tuxcraft's i3 picom uses and is tested with (NVIDIA too)
vsync = true;
dithered-present = false;
use-damage = true;
unredir-if-possible = true;   # fullscreen games/video bypass the compositor (no added latency)
detect-transient = true;
detect-client-leader = true;
detect-client-opacity = true;
detect-rounded-corners = false;
use-ewmh-active-win = true;   # dwm sets _NET_ACTIVE_WINDOW: "focused" below follows it

corner-radius = 15;

blur-method = "dual_kawase";
blur-size = 10;
blur-strength = 3;
blur-background = true;
blur-background-fixed = true;

shadow = true;
shadow-radius = 1;
shadow-opacity = 0.6;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-color = "#393943";

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 3;

rules = (
  # Her rules: focused windows solid, the others 85 %; menus and tooltips lighter.
  { match = "focused"; opacity = 1; },
  { match = "!focused"; opacity = 0.85; },
  { match = "window_type = 'tooltip'"; fade = true; shadow = true; opacity = 0.5; full-shadow = false; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'"; opacity = 0.7; },
  { match = "class_g = 'qutebrowser'"; shadow = true; full-shadow = true; },

  # tuxcraft's guards (same as picom.conf):
  # dwm's own bar (class "dwm"): square, no blur halo, no shadow.
  { match = "class_g = 'dwm'"; corner-radius = 0; shadow = false; opacity = 1; },
  # GTK 4 popovers and menus draw their own shadow in transparent margins: blurring behind them
  # smears the window underneath.
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },
  { match = "window_type = 'dnd' || window_type = 'utility' || window_type = 'menu'"; shadow = false; blur-background = false; },
  # Screenshot region selection (slop/maim) and screenkey: a fullscreen overlay, never blur or dim it.
  { match = "class_g = 'slop' || class_g = 'maim' || class_g *?= 'screenkey'"; shadow = false; fade = false; blur-background = false; opacity = 1; },
  # Video, games and anything fullscreen: solid and square, whether focused or not.
  { match = "fullscreen || class_g = 'mpv' || class_g *?= 'steam' || class_g = 'gamescope' || class_g *?= 'resolve'"; opacity = 1; corner-radius = 0; shadow = false; },
  # Terminals stay see-through even fullscreen (unredir would make them solid).
  { match = "class_g = 'kitty' || class_g = 'Alacritty' || class_g ^= 'tux-float'"; unredir = false; },
);
