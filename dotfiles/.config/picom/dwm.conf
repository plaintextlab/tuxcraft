# tuxcraft picom for the dwm session (tux-dwm): BreadOnPenguins' look, from her
# github.com/BreadOnPenguins/dots (.config/picom/picom.conf): square corners, blur behind every
# window, unfocused windows see-through, slow soft fades, barely any shadow. Window animations
# are tuxcraft's (the same as in the i3 session).
# The i3 session keeps ~/.config/picom/picom.conf; tux-autostart starts picom with this file in
# dwm only. Your previous picom.conf is also kept in ~/.config/picom/backup/.
# Toggle picom at runtime: Super+Escape -> "Compositor on/off".

backend = "glx";   # hers is "egl"; glx is what tuxcraft's i3 picom uses and is tested with (NVIDIA too)
vsync = true;
dithered-present = false;
use-damage = true;
unredir-if-possible = true;   # fullscreen games/video bypass the compositor (no added latency)
detect-transient = true;
detect-client-leader = true;
detect-client-opacity = true;
detect-rounded-corners = false;
use-ewmh-active-win = true;   # dwm sets _NET_ACTIVE_WINDOW: "focused" below follows it

corner-radius = 0;   # her picom.conf says 15, but her screenshot (and her dwm) shows square corners

blur-method = "dual_kawase";
blur-size = 10;
blur-strength = 3;
blur-background = true;
blur-background-fixed = true;

shadow = true;
shadow-radius = 1;
shadow-opacity = 0.6;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-color = "#393943";

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 3;

rules = (
  # Her rules: focused windows solid, the others 85 %; menus and tooltips lighter.
  { match = "focused"; opacity = 1; },
  { match = "!focused"; opacity = 0.85; },
  { match = "window_type = 'tooltip'"; fade = true; shadow = true; opacity = 0.5; full-shadow = false; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'"; opacity = 0.7; },
  { match = "class_g = 'qutebrowser'"; shadow = true; full-shadow = true; },

  # tuxcraft's guards (same as picom.conf):
  # dwm's own bar (class "dwm"): see-through like the unfocused windows (85 %, the blurred wallpaper
  # behind it), as in her screenshot, where the bar gets that from her "!focused" rule. No shadow.
  { match = "class_g = 'dwm'"; opacity = 0.85; blur-background = true; shadow = false; },
  # GTK 4 popovers and menus draw their own shadow in transparent margins: blurring behind them
  # smears the window underneath.
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },
  { match = "window_type = 'dnd' || window_type = 'utility' || window_type = 'menu'"; shadow = false; blur-background = false; },
  # Screenshot region selection (slop/maim) and screenkey: a fullscreen overlay, never blur or dim it.
  { match = "class_g = 'slop' || class_g = 'maim' || class_g *?= 'screenkey'"; shadow = false; fade = false; blur-background = false; opacity = 1; },
  # Video, games and anything fullscreen: solid and square, whether focused or not.
  { match = "fullscreen || class_g = 'mpv' || class_g *?= 'steam' || class_g = 'gamescope' || class_g *?= 'resolve'"; opacity = 1; corner-radius = 0; shadow = false; },
  # Terminals stay see-through even fullscreen (unredir would make them solid).
  { match = "class_g = 'kitty' || class_g = 'Alacritty' || class_g ^= 'tux-float'"; unredir = false; },

  # ---- Animations: the same as the i3 session's (picom.conf), on top of her look.
  # Menus, tooltips and the bar: a quick fade only (no zooming popups, no sliding bar).
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'dock' || window_type = 'desktop' || window_type = 'dnd'";
    animations = (
      { triggers = ["open", "show"]; opacity = { curve = "cubic-bezier(0, 0, 0.2, 1)"; duration = 0.10; start = 0; end = "window-raw-opacity"; }; blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      { triggers = ["close", "hide"]; opacity = { curve = "linear"; duration = 0.08; start = "window-raw-opacity-before"; end = 0; }; blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      { triggers = ["geometry"]; offset-x = 0; },
    );
  },
  # Launchers (dmenu too) and notifications: a short, gentle pop.
  { match = "class_g = 'Rofi' || class_g = 'fuzzel' || class_g = 'Dunst' || class_g = 'dmenu'";
    animations = (
      { triggers = ["open", "show"]; preset = "appear"; scale = 0.96; duration = 0.14; },
      { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.96; duration = 0.10; },
    );
  },
  # Screenshot region selection (slop/maim) is a fullscreen transparent overlay: never blur,
  # dim or animate what is under it. Games and video: no animations in the way.
  # (A script without a timing function ends at once: that is how an animation is switched off.)
  { match = "class_g = 'slop' || class_g = 'maim'"; shadow = false; fade = false; blur-background = false; opacity = 1; animations = ({ triggers = ["open", "show", "close", "hide", "geometry"]; offset-x = 0; }); },
  { match = "fullscreen || class_g = 'gamescope' || class_g *?= 'steam_app'"; animations = ({ triggers = ["open", "show", "close", "hide", "geometry"]; offset-x = 0; }); },
  # dwm hides windows of other tags by moving them off screen; while it does that it marks them
  # with _TUX_DWM_HIDDEN, so the tiling glide below does not slide them across the screen.
  # (A script without a timing function ends at once: that is how an animation is switched off.)
  { match = "_TUX_DWM_HIDDEN@"; animations = ({ triggers = ["geometry"]; offset-x = 0; }); },
);

# Window animations (open, close, tiling glide), as in i3. Delete this block for none, as in her
# picom. Speed: the "duration" values (seconds).
animations = (
  # Open: zoom in from 85% with a springy overshoot (Hyprland's favourite curve), fade in.
  {
    triggers = ["open"];
    opacity = { curve = "cubic-bezier(0, 0, 0.2, 1)"; duration = 0.10; start = 0; end = "window-raw-opacity"; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)"; duration = 0.16; start = 0.85; end = 1; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  # Close: shrink to 90% and fade out.
  {
    triggers = ["close"];
    opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.10; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.10; start = 1; end = 0.9; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  # Workspace switch (i3/sway unmap the old workspace's windows): a quick crossfade with a hint
  # of zoom. i3 does not tell the compositor the direction, so no sideways slide that could
  # go the wrong way.
  {
    triggers = ["show"];
    opacity = { curve = "cubic-bezier(0, 0, 0.2, 1)"; duration = 0.10; start = 0; end = "window-raw-opacity"; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.2, 0.9, 0.3, 1)"; duration = 0.12; start = 0.98; end = 1; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["hide"];
    opacity = { curve = "linear"; duration = 0.06; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  },
  # Tiling: windows glide to their new place and size (new split, closed neighbour, resize).
  { triggers = ["geometry"]; preset = "geometry-change"; duration = 0.14; },
);
