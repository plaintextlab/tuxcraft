# tuxcraft picom (v12+ "rules" and animation-script syntax). Rewritten from the debi3n config,
# which had duplicated keys picom rejects, options from forks that upstream ignores, and 55%
# inactive opacity that made unfocused text hard to read.
# Toggle picom at runtime: Super+Escape -> "Compositor on/off".
#
# Animations aim for a Hyprland feel: windows pop in with a slight springy overshoot, close by
# shrinking away, glide when tiles move or resize, and workspaces crossfade. picom renders at the
# monitor's refresh rate (vsync), so a 120/144 Hz screen gets 120/144 fps animations.
# Kept short (100-160 ms) so the desktop feels instant: the motion shows, the wait does not.
# Tweak speed: change the "duration" values (seconds). No animations at all: delete the
# `animations = ...` block at the bottom.

backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;   # fullscreen games/video bypass the compositor (no added latency)
detect-transient = true;
detect-client-leader = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.40;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Opacity changes (focus dimming) fade smoothly; open/close use the animations below.
fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-delta = 8;

blur-method = "dual_kawase";
blur-strength = 4;
blur-background = false;

corner-radius = 0;

rules = (
  { match = "window_type = 'dock' || window_type = 'desktop'"; shadow = false; corner-radius = 0; },
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'dnd' || window_type = 'utility'"; shadow = false; },
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },
  { match = "class_g = 'Rofi'"; blur-background = true; },
  { match = "!focused && !fullscreen"; opacity = 0.93; },
  { match = "fullscreen || class_g = 'mpv' || class_g *?= 'firefox' || class_g *?= 'chromium' || class_g *?= 'steam' || class_g = 'gamescope' || class_g *?= 'resolve'"; opacity = 1; shadow = false; },

  # Menus, tooltips and the bar: a quick fade only (no zooming popups, no sliding bar).
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'dock' || window_type = 'desktop' || window_type = 'dnd'";
    animations = (
      { triggers = ["open", "show"]; opacity = { curve = "cubic-bezier(0, 0, 0.2, 1)"; duration = 0.10; start = 0; end = "window-raw-opacity"; }; blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      { triggers = ["close", "hide"]; opacity = { curve = "linear"; duration = 0.08; start = "window-raw-opacity-before"; end = 0; }; blur-opacity = "opacity"; shadow-opacity = "opacity"; },
      { triggers = ["geometry"]; offset-x = 0; },
    );
  },
  # Launcher and notifications: a short, gentle pop.
  { match = "class_g = 'Rofi' || class_g = 'fuzzel' || class_g = 'Dunst'";
    animations = (
      { triggers = ["open", "show"]; preset = "appear"; scale = 0.96; duration = 0.14; },
      { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.96; duration = 0.10; },
    );
  },
  # Screenshot region selection (slop/maim) is a fullscreen transparent overlay: never blur,
  # dim or animate what is under it. Games and video: no animations in the way.
  # (A script without a timing function ends at once: that is how an animation is switched off.)
  { match = "class_g = 'slop' || class_g = 'maim'"; shadow = false; fade = false; blur-background = false; opacity = 1; animations = ({ triggers = ["open", "show", "close", "hide", "geometry"]; offset-x = 0; }); },
  { match = "fullscreen || class_g = 'gamescope' || class_g *?= 'steam_app'"; animations = ({ triggers = ["open", "show", "close", "hide", "geometry"]; offset-x = 0; }); },
);

animations = (
  # Open: zoom in from 85% with a springy overshoot (Hyprland's favourite curve), fade in.
  {
    triggers = ["open"];
    opacity = { curve = "cubic-bezier(0, 0, 0.2, 1)"; duration = 0.10; start = 0; end = "window-raw-opacity"; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.05, 0.9, 0.1, 1.05)"; duration = 0.16; start = 0.85; end = 1; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  # Close: shrink to 90% and fade out.
  {
    triggers = ["close"];
    opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.10; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.10; start = 1; end = 0.9; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  # Workspace switch (i3/sway unmap the old workspace's windows): a quick crossfade with a hint
  # of zoom. i3 does not tell the compositor the direction, so no sideways slide that could
  # go the wrong way.
  {
    triggers = ["show"];
    opacity = { curve = "cubic-bezier(0, 0, 0.2, 1)"; duration = 0.10; start = 0; end = "window-raw-opacity"; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { curve = "cubic-bezier(0.2, 0.9, 0.3, 1)"; duration = 0.12; start = 0.98; end = 1; };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["hide"];
    opacity = { curve = "linear"; duration = 0.06; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  },
  # Tiling: windows glide to their new place and size (new split, closed neighbour, resize).
  { triggers = ["geometry"]; preset = "geometry-change"; duration = 0.14; },
);
