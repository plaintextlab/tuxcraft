# tuxcraft picom (v12+ "rules" syntax). Rewritten from the debi3n config, which had
# duplicated keys (animations, shadow-exclude, unredir-if-possible) that picom rejects,
# options from picom forks that upstream ignores, and 55% inactive opacity that made
# unfocused text hard to read.
# Toggle picom at runtime: Super+Escape -> "Compositor on/off".

backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;   # fullscreen games/video bypass the compositor
detect-transient = true;
detect-client-leader = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.40;
shadow-offset-x = -12;
shadow-offset-y = -12;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

blur-method = "dual_kawase";
blur-strength = 4;
blur-background = false;

corner-radius = 0;

rules = (
  { match = "window_type = 'dock' || window_type = 'desktop'"; shadow = false; corner-radius = 0; },
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'dnd' || window_type = 'utility'"; shadow = false; },
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },
  { match = "class_g = 'Rofi'"; blur-background = true; },
  { match = "!focused && !fullscreen"; opacity = 0.93; },
  { match = "fullscreen || class_g = 'mpv' || class_g *?= 'firefox' || class_g *?= 'chromium' || class_g *?= 'steam' || class_g = 'gamescope' || class_g *?= 'resolve'"; opacity = 1; shadow = false; },
  { match = "class_g = 'slop' || class_g = 'maim'"; shadow = false; fade = false; },
);

animations = (
  { triggers = ["open", "show"]; preset = "appear"; scale = 0.95; duration = 0.15; },
  { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.95; duration = 0.12; },
);
