; tuxcraft polybar (X11). Colours/fonts: colors.ini (generated by tux-theme).
include-file = ~/.config/polybar/colors.ini

[settings]
screenchange-reload = true
pseudo-transparency = false

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
padding-left = 0
padding-right = 1
module-margin = 1
separator = "|"
separator-foreground = ${colors.disabled}
font-0 = ${fonts.main}
font-1 = ${fonts.icons}
font-2 = ${fonts.emoji}
modules-left = i3 xwindow
modules-right = nowplaying collapse cpu memory gpu updates btbattery volume net battery powerprofile screenrecord date
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

[bar/main-tray]
inherit = bar/main
modules-right = nowplaying collapse cpu memory gpu updates btbattery volume net battery powerprofile tray screenrecord date

; Collapsed by default (Windows tray-overflow style): the chevron shows/hides
; the modules listed in click-left, which are marked hidden = true (CPU, memory, GPU).
; Everything else always stays visible: music player, updates, Bluetooth devices,
; volume, network, battery, power profile, tray icons, REC indicator and clock.
; The chevron is fixed text in format-0/format-1, not hook output: polybar 3.7 sometimes
; loses a custom/ipc hook's output when the bar (re)starts, and an empty module has no
; button to click. The hooks only keep the state file in step.
[module/collapse]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/collapse.sh reset
hook-1 = true
initial = 1
format-0 = 󰅁
format-0-foreground = ${colors.primary}
format-1 = 󰅂
format-1-foreground = ${colors.primary}
click-left = ~/.config/polybar/scripts/collapse.sh toggle cpu memory gpu &

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.alert}
label-mode-foreground = ${colors.background}
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.on-primary}
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-padding = 1
label-visible = %index%
label-visible-underline = ${colors.primary}
label-visible-padding = 1
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%
label-foreground = ${colors.foreground-dim}

; Default output: icon shows what it is (speakers / headphones / Bluetooth headphones or
; speaker / HDMI); built-in speakers turn yellow (warn) while asleep. Click: mute,
; scroll: volume, right-click: mixer, middle-click: pick the output.
[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh tail
tail = true
click-left = ~/.config/polybar/scripts/volume.sh mute
click-middle = tux-audio output &
click-right = tux-term --class tux-float -e tux-mixer &
scroll-up = ~/.config/polybar/scripts/volume.sh up
scroll-down = ~/.config/polybar/scripts/volume.sh down

; tux-netinfo picks wifi or ethernet automatically (polybar needs one module per interface type otherwise)
[module/net]
type = custom/script
exec = tux-netinfo
interval = 5
click-left = tux-term --class tux-float -e tux-net &
click-right = tux-term --class tux-float -e tux-net nmtui &

[module/cpu]
type = internal/cpu
hidden = true
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
hidden = true
interval = 3
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%% %gb_free% free

; GPU load + free VRAM (NVIDIA or AMD); hidden when there is no dedicated GPU.
[module/gpu]
type = custom/script
hidden = true
exec = ~/.config/polybar/scripts/gpu.sh
interval = 3

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 15

[module/powerprofile]
type = custom/script
exec = ~/.config/polybar/scripts/powerprofile.sh
interval = 5
click-left = tux-powerprofile &

[module/updates]
type = custom/script
exec = tux-updates --bar
interval = 1800
click-left = tux-term --class tux-float-big -e sysup --pause &

[module/date]
type = internal/date
interval = 1
date = 󰥔 %H:%M
date-alt = 󰃭 %a %d %b %Y  %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[module/tray]
type = internal/tray
tray-spacing = 8pt

[module/screenrecord]
; Red "REC" while a screen/mic recording runs (tux-capture, GPU Screen Recorder or OBS); click stops it.
type = custom/script
exec = tux-capture status
interval = 2
format-foreground = ${colors.alert}
click-left = tux-capture stop &

[module/nowplaying]
; Now playing (MPRIS: browsers, Spotify, mpv, ...; games are not MPRIS players): buttons + scrolling title.
type = custom/script
exec = tux-nowplaying 24
tail = true
format-foreground = ${colors.foreground}

[module/btbattery]
; Connected Bluetooth devices: icon + battery (headphones, speakers, DualSense/DS4, ...). Click: bluetui.
type = custom/script
exec = tux-btbattery
interval = 10
click-left = tux-term --class tux-float -e bluetui &
