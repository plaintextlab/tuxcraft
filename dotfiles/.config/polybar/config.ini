; tuxcraft polybar (X11). Colours/fonts: colors.ini (generated by tux-theme).
include-file = ~/.config/polybar/colors.ini

[settings]
screenchange-reload = true
pseudo-transparency = false

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
padding-left = 0
padding-right = 1
module-margin = 1
separator = "|"
separator-foreground = ${colors.disabled}
font-0 = ${fonts.main}
font-1 = ${fonts.icons}
font-2 = ${fonts.emoji}
modules-left = i3 xwindow
modules-right = updates pulseaudio net cpu memory battery powerprofile date
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

[bar/main-tray]
inherit = bar/main
modules-right = updates pulseaudio net cpu memory battery powerprofile date tray

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.alert}
label-mode-foreground = ${colors.background}
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.on-primary}
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-padding = 1
label-visible = %index%
label-visible-underline = ${colors.primary}
label-visible-padding = 1
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%
label-foreground = ${colors.foreground-dim}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${colors.disabled}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}
click-right = alacritty --class tux-float -e tux-mixer &

; tux-netinfo picks wifi or ethernet automatically (polybar needs one module per interface type otherwise)
[module/net]
type = custom/script
exec = tux-netinfo
interval = 5
click-left = alacritty --class tux-float -e nmtui &

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 15

[module/powerprofile]
type = custom/script
exec = ~/.config/polybar/scripts/powerprofile.sh
interval = 5
click-left = tux-powerprofile &

[module/updates]
type = custom/script
exec = tux-updates --bar
interval = 1800
click-left = alacritty --class tux-float-big -e sysup --pause &

[module/date]
type = internal/date
interval = 1
date = 󰥔 %H:%M
date-alt = 󰃭 %a %d %b %Y  %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[module/tray]
type = internal/tray
tray-spacing = 8pt
