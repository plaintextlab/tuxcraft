# tuxcraft — keybindings and behaviour shared by i3 (X11) and sway (Wayland).
# Session files define: $mod $alt $term $menu $windows $lock $clip $files_gui $bar_restart
# Lines starting with "#: " are shown by Super+K (tux-keys).

floating_modifier $mod
workspace_auto_back_and_forth yes
focus_on_window_activation focus
focus_follows_mouse yes
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart
gaps inner 8
gaps outer 0
smart_gaps on

#: Super+Enter            Terminal
bindsym $mod+Return exec $term
#: Super+D                App launcher
bindsym $mod+d exec $menu
#: Super+Space            Switch to an open window
bindsym $mod+space exec $windows
#: Super+Q / Alt+F4       Close window
bindsym $mod+q kill
bindsym $alt+F4 kill
#: Super+B                Web browser
bindsym $mod+b exec tux-open browser
#: Super+Shift+B          Private browser window
bindsym $mod+Shift+b exec tux-open browser-private
#: Super+E                Files (Thunar)
bindsym $mod+e exec $files_gui
#: Super+Shift+E          Files: drives (/media)
bindsym $mod+Shift+e exec $files_gui /media
#: Super+M                Music (ncmpcpp)
bindsym $mod+m exec $term --class tux-float -e ncmpcpp
#: Super+T                Notes (fzf picker)
bindsym $mod+t exec $term --class tux-float -e tux-notes
#: Super+Shift+T          New note
bindsym $mod+Shift+t exec $term --class tux-float -e tux-notes --new
#: Super+C                Calculator (qalc)
bindsym $mod+c exec $term --class tux-float -e qalc
#: Super+V                Clipboard history
bindsym $mod+v exec $clip
#: Super+K                This keybinding list
bindsym $mod+k exec tux-keys
#: Super+Escape           System menu (theme, font, update, snapshots, ...)
bindsym $mod+Escape exec tux-control
#: Super+Shift+L          Power menu (lock, logout, reboot, shutdown)
bindsym $mod+Shift+l exec tux-power
#: Super+Alt+L            Lock screen
bindsym $mod+$alt+l exec $lock

# --- system TUIs (floating)
#: Super+Ctrl+N           Network (nmtui)
bindsym $mod+Ctrl+n exec $term --class tux-float -e nmtui
#: Super+Ctrl+B           Bluetooth (bluetui)
bindsym $mod+Ctrl+b exec $term --class tux-float -e bluetui
#: Super+Ctrl+A           Audio mixer
bindsym $mod+Ctrl+a exec $term --class tux-float -e tux-mixer
#: Super+Ctrl+M           System monitor (btop)
bindsym $mod+Ctrl+m exec $term --class tux-float-big -e btop
#: Super+U                Update the system safely (sysup)
bindsym $mod+u exec $term --class tux-float-big -e sysup --pause
#: Super+Ctrl+T           Change colour theme
bindsym $mod+Ctrl+t exec tux-theme --menu
#: Super+Ctrl+F           Change font
bindsym $mod+Ctrl+f exec tux-font --menu
#: Super+Ctrl+W           Wallpaper picker
bindsym $mod+Ctrl+w exec tux-wallpaper --menu
#: Super+Shift+W          Random wallpaper
bindsym $mod+Shift+w exec tux-wallpaper random

# --- audio / media / brightness
#: Super+P / Super+Shift+P  Audio output / input device
bindsym $mod+p exec tux-audio output
bindsym $mod+Shift+p exec tux-audio input
bindsym XF86AudioRaiseVolume exec tux-osd volume up
bindsym XF86AudioLowerVolume exec tux-osd volume down
bindsym XF86AudioMute exec tux-osd volume mute
bindsym XF86AudioMicMute exec tux-osd mic mute
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous
bindsym XF86AudioStop exec playerctl stop
bindsym XF86MonBrightnessUp exec tux-osd brightness up
bindsym XF86MonBrightnessDown exec tux-osd brightness down
#: Super+Alt+Up / Down       Monitor brightness (DDC/CI on desktops)
bindsym $mod+$alt+Up exec tux-osd brightness up
bindsym $mod+$alt+Down exec tux-osd brightness down
#: Super+Alt+Right / Left    Monitor contrast (DDC/CI)
bindsym $mod+$alt+Right exec tux-osd contrast up
bindsym $mod+$alt+Left exec tux-osd contrast down
#: Numpad 8/2/0 (NumLock off)  Volume up/down/mute
bindsym KP_Up exec tux-osd volume up
bindsym KP_Down exec tux-osd volume down
bindsym KP_Insert exec tux-osd volume mute
#: Numpad 4/5/6 (NumLock off)  Previous / play-pause / next
bindsym KP_Left exec playerctl previous
bindsym KP_Begin exec playerctl play-pause
bindsym KP_Right exec playerctl next
#: Super+N / Super+Shift+N  Night light on / off
bindsym $mod+n exec tux-nightlight on
bindsym $mod+Shift+n exec tux-nightlight off
#: Super+Delete           Power profile
bindsym $mod+Delete exec tux-powerprofile

# --- screenshots
#: Print                  Screenshot of a region (copied + saved)
bindsym Print exec tux-capture region
#: Shift+Print            Screenshot of the whole screen
bindsym Shift+Print exec tux-capture screen
#: Super+Print            Capture menu (region/screen/record video/mic)
bindsym $mod+Print exec tux-capture menu
#: Super+Shift+Print      Stop recording
bindsym $mod+Shift+Print exec tux-capture stop

# --- windows
#: Super+Arrows           Focus window
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
#: Super+Shift+Arrows     Move window
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right
#: Super+Shift+H / V      Split horizontally / vertically
bindsym $mod+Shift+h split h
bindsym $mod+Shift+v split v
#: Super+F                Fullscreen
bindsym $mod+f fullscreen toggle
#: Super+S / W / X        Layout stacked / tabbed / toggle split
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+x layout toggle split
#: Super+Ctrl+L           Layout menu
bindsym $mod+Ctrl+l exec tux-layout
#: Super+Shift+Space      Float / tile window
bindsym $mod+Shift+space floating toggle
#: Super+Alt+Space        Float / tile every window on this workspace
bindsym $mod+$alt+space [workspace=__focused__] floating toggle
#: Super+A                Web apps (YouTube, Gmail, ... as app windows)
bindsym $mod+a exec tux-webapps
#: Super+Shift+S          Pin window on all workspaces (sticky)
bindsym $mod+Shift+s exec tux-sticky
#: Super+Shift+- / Super+-  Send to / show scratchpad
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show
#: Super+R                Resize mode (arrows, Esc to leave)
bindsym $mod+r mode "resize"
mode "resize" {
    bindsym Left resize shrink width 10 px or 5 ppt
    bindsym Down resize grow height 10 px or 5 ppt
    bindsym Up resize shrink height 10 px or 5 ppt
    bindsym Right resize grow width 10 px or 5 ppt
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+r mode "default"
}

# --- workspaces
#: Super+1..0             Go to workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
#: Super+Shift+1..0       Move window to workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10
#: Super+Tab / Super+Shift+Tab  Next / previous workspace
bindsym $mod+Tab workspace next
bindsym $mod+Shift+Tab workspace prev
#: Alt+Tab                Back to the last workspace
bindsym $alt+Tab workspace back_and_forth
#: Ctrl+Tab / Ctrl+Shift+Tab  Next / previous window in this workspace
bindsym ctrl+Tab focus next
bindsym ctrl+Shift+Tab focus prev
#: Super+Ctrl+Left/Right  Move workspace to other monitor
bindsym $mod+Ctrl+Left move workspace to output left
bindsym $mod+Ctrl+Right move workspace to output right
#: Super+Shift+R          Reload config
