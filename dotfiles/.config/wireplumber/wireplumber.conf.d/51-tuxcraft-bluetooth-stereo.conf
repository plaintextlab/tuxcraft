# tuxcraft: Bluetooth headphones and earbuds stay in stereo (A2DP).
# WirePlumber normally switches them to the headset profile (HSP/HFP) whenever an app opens a
# microphone, which turns playback into low-quality mono call audio. With this file it never
# switches by itself: pick the "Headset Head Unit" profile yourself when you want the mic
# (pavucontrol, or: pactl set-card-profile bluez_card.<MAC> headset-head-unit), and
# "a2dp-sink" to go back. Remove this file to restore WirePlumber's automatic switching.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
