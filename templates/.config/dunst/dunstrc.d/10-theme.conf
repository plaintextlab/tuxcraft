# Generated by tux-theme ({{theme_name}})
[global]
    font = {{font}} {{font_size}}
    frame_color = "{{accent}}"
    separator_color = frame
    highlight = "{{accent}}"
    icon_theme = "{{icon_theme}}, Adwaita"

[urgency_low]
    background = "{{bg}}"
    foreground = "{{fg_dim}}"
    frame_color = "{{bg_hl}}"
    highlight = "{{muted}}"

[urgency_normal]
    background = "{{bg}}"
    foreground = "{{fg}}"
    frame_color = "{{accent}}"
    highlight = "{{accent}}"

[urgency_critical]
    background = "{{bg}}"
    foreground = "{{fg}}"
    frame_color = "{{red}}"
    highlight = "{{red}}"
