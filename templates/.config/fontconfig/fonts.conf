<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Generated by tux-theme. Nerd Font symbols + emoji fall back behind every font. -->
<fontconfig>
  <!-- Apps in a distrobox (Claude Desktop, ...): the fonts tuxcraft installs on the host, seen
       there under /run/host. Elsewhere the folder does not exist and is skipped. -->
  <dir>/run/host/usr/local/share/fonts</dir>
  <!-- The generic families: strong, or the locale's language outranks them and an emoji the
       font lacks comes from DejaVu, in black and white, instead of Noto Color Emoji. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>{{term_font}}</family><family>Symbols Nerd Font Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <!-- Any font asked for by name (the one tux-font set, a site's, an app's): what it lacks
       comes first from the Nerd Font symbols and Noto Color Emoji, right behind it, so a font
       without emoji (More Perfect DOS VGA, Noto Sans, ...) still shows them in colour, never a
       box. Generic names are left to the aliases above. -->
  <match target="pattern">
    <test name="family" qual="first" compare="not_eq"><string>sans-serif</string></test>
    <test name="family" qual="first" compare="not_eq"><string>sans</string></test>
    <test name="family" qual="first" compare="not_eq"><string>serif</string></test>
    <test name="family" qual="first" compare="not_eq"><string>monospace</string></test>
    <test name="family" qual="first" compare="not_eq"><string>mono</string></test>
    <test name="family" qual="first" compare="not_eq"><string>system-ui</string></test>
    <test name="family" qual="first" compare="not_eq"><string>emoji</string></test>
    <test name="family" qual="first" compare="not_eq"><string>cursive</string></test>
    <test name="family" qual="first" compare="not_eq"><string>fantasy</string></test>
    <test name="family" qual="first" compare="not_eq"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="append" binding="same"><string>Symbols Nerd Font</string><string>Noto Color Emoji</string></edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <!-- dwm's bar and dmenu are see-through (picom, dwm session): colour (subpixel) smoothing there
       shows as rainbow edges, so they get grey smoothing. -->
  <match target="font">
    <test name="prgname" compare="eq"><string>dwm</string></test>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="prgname" compare="eq"><string>dmenu</string></test>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
