# Generated by tux-theme ({{theme_name}})
[main]
font={{font}}:size={{font_size}}
icon-theme={{icon_theme}}
terminal=alacritty -e
width=48
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8
layer=overlay

[colors]
background={{bg_dark_raw}}f2
text={{fg_raw}}ff
prompt={{accent_raw}}ff
placeholder={{muted_raw}}ff
input={{fg_raw}}ff
match={{accent_raw}}ff
selection={{bg_hl_raw}}ff
selection-text={{fg_raw}}ff
selection-match={{accent_raw}}ff
border={{accent_raw}}ff

[border]
width=2
radius=0
