# Generated by tux-theme. xsettingsd pushes these to running GTK apps on X11 (live theme switch).
Net/ThemeName "{{gtk_theme}}"
Net/IconThemeName "{{icon_theme}}"
Gtk/CursorThemeName "Adwaita"
Gtk/CursorThemeSize 24
Gtk/FontName "{{font}} {{font_size}}"
Gtk/DecorationLayout "menu:"
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintslight"
Xft/RGBA "rgb"
